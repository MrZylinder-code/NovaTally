name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax prüfen
        run: python -m compileall -q NovaTally.pyw novatally tests tools

      - name: Tests (nur Standardbibliothek)
        run: python -m unittest discover -s tests -v

      - name: Windows-Teile prüfen (psutil, Tray-Symbol, Autostart-Befehl)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -c "from novatally.tracker import PsutilSource; p = PsutilSource().snapshot(); print(len(p), 'Prozesse,', sum(1 for x in p if x[2]), 'mit EXE-Pfad'); assert p"
          python -c "from novatally.tray import draw_icon; print(draw_icon(paused=False).size, draw_icon(paused=True).size)"
          python -c "from novatally import autostart; print(autostart.command())"
          python -c "from novatally import library; e = library.scan(); print(len(e), 'Spiele erkannt')"

  build:
    name: Windows-EXE bauen
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pyinstaller

      - name: NovaTally.exe bauen (wie build.bat)
        run: >
          python -m PyInstaller --noconfirm --clean --log-level WARN
          --noconsole --onefile --name NovaTally
          --icon novatally\web\icon.ico
          --add-data "novatally\web;novatally\web"
          --hidden-import pystray._win32
          NovaTally.pyw

      - name: EXE starten und Oberfläche abrufen
        shell: pwsh
        run: |
          $env:NOVATALLY_DATA = Join-Path $env:RUNNER_TEMP "novatally-daten"
          $p = Start-Process -FilePath "dist\NovaTally.exe" -ArgumentList "--demo","--headless" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $ping = Invoke-RestMethod -Uri "http://127.0.0.1:47815/api/ping" -Headers @{ "X-NovaTally" = "1" }
              $ok = $ping.app -eq "NovaTally"
            } catch { }
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "EXE antwortet nicht" }
          $html = Invoke-WebRequest -Uri "http://127.0.0.1:47815/" -UseBasicParsing
          if ($html.Content -notmatch "app.js") { throw "Oberfläche fehlt in der EXE" }
          $o = Invoke-RestMethod -Uri "http://127.0.0.1:47815/api/overview?range=30" -Headers @{ "X-NovaTally" = "1" }
          Write-Host "OK: $($o.games) Spiele, $($o.sessions) Sitzungen in der Demo"
          Stop-Process -Id $p.Id -Force

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        continue-on-error: true  # volles Artefakt-Kontingent soll den Test nicht rot machen
        with:
          name: NovaTally-exe
          path: dist/NovaTally.exe
          retention-days: 7
