name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax prüfen
        run: python -m compileall -q NovaTally.pyw novatally tests tools

      - name: Tests (nur Standardbibliothek)
        run: python -m unittest discover -s tests -v

      - name: Windows-Teile prüfen (psutil, Tray-Symbol, Autostart-Befehl)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -c "from novatally.tracker import PsutilSource; p = PsutilSource().snapshot(); print(len(p), 'Prozesse,', sum(1 for x in p if x[2]), 'mit EXE-Pfad'); assert p"
          python -c "from novatally.tray import draw_icon; print(draw_icon(paused=False).size, draw_icon(paused=True).size)"
          python -c "from novatally import autostart; print(autostart.command())"
          python -c "from novatally import library; e = library.scan(); print(len(e), 'Spiele erkannt')"
          python -c "from novatally import window; assert window.available(), 'pywebview fehlt'; import webview; print('pywebview', webview.__version__ if hasattr(webview, '__version__') else 'ok')"

  build:
    name: Windows-EXE bauen
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pyinstaller

      - name: NovaTally.exe bauen (wie build.bat)
        run: python tools/build_exe.py

      - name: EXE starten und Oberfläche abrufen
        shell: pwsh
        run: ./tools/smoke_test.ps1 -Exe dist\NovaTally.exe

      - name: Neustart nach Update prüfen (eigener Temp-Ordner)
        shell: pwsh
        run: ./tools/restart_test.ps1 -Exe dist\NovaTally.exe

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: ./tools/build_installer.ps1

      - name: Installer testen (installieren, starten, aktualisieren, deinstallieren)
        shell: pwsh
        run: ./tools/installer_test.ps1

      - name: Eigenes Fenster prüfen (informativ)
        continue-on-error: true
        shell: pwsh
        run: ./tools/window_test.ps1 -Exe dist\NovaTally.exe

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        continue-on-error: true  # volles Artefakt-Kontingent soll den Test nicht rot machen
        with:
          name: NovaTally-exe
          path: |
            dist/NovaTally.exe
            dist/NovaTally-Setup.exe
          retention-days: 7
